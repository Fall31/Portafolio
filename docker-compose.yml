services:
  web:
    image: ${DOCKERHUB_USERNAME}/portafolio:latest
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: portafolio
    ports:
      - "80:80"
    restart: unless-stopped